[package]
name = "ts-stream"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "ISDB-T one-seg TS HTTP streamer for RTL-SDR"

[[bin]]
name = "ts-stream"
path = "src/main.rs"

[lib]
name = "ts_stream"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
libloading = "0.8"
num-complex = "0.4"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
